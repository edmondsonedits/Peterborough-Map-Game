<!doctype html>
<!-- =========================================================
     BEGINNER CODE GUIDE — DESKTOP GEO GUESSER WRAPPER

     PURPOSE:
     This outer page embeds the shared Geo Guesser, loads shared dispatch data,
     connects the online Firebase scoreboard, and keeps a loading cover visible
     until the inner game and data are usable.

     WHAT THE PLAYER EXPERIENCES:
     The desktop Geo Guesser fills the screen. Local gameplay can still open when
     the online scoreboard fails; scoreboard controls then show a clear error.

     Comments are ignored by the browser and never appear inside the game.
     ========================================================= -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121218">
<title>Peterborough Geo Guesser</title>
<style>
/* The iframe owns gameplay; the temporary loading layer sits above it. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#121218}#game-frame{position:fixed;inset:0;width:100%;height:100%;border:0}.loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#121218;color:#fff;font-family:system-ui,sans-serif;transition:opacity .18s}.loading.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- v1.5.3 forces a fresh copy of the shared game page after release. -->
<iframe id="game-frame" src="../index.html?v=1.5.5" title="Peterborough Geo Guesser"></iframe>
<div class="loading" id="loading">Loading Geo Guesser…</div>
<script src="../../shared/build-version.js?v=1.5.5"></script>
<script src="../../shared/dispatch-locations.js?v=1.4.20"></script>
<script src="../../shared/dispatch-data-1.4.4.js?v=1.4.20"></script>
<script src="../../shared/dispatch-override-1.4.4.js?v=1.4.20"></script>
<script>
(()=>{
/*
VERSION is used only for release identity and cache-refreshing the scoreboard
client. The dispatch dataset keeps its own independent data version.
*/
const VERSION='1.5.3';
const frame=document.getElementById('game-frame');
const loading=document.getElementById('loading');
const child=()=>frame.contentWindow;

/*
FUNCTION: addScript

WHAT THE CODE DOES:
Adds one script to the iframe and returns a Promise. A 15-second timeout rejects
startup for that optional client instead of waiting forever.
*/
function addScript(src){
  return new Promise((resolve,reject)=>{
    const d=frame.contentDocument;
    const s=d.createElement('script');
    const timer=setTimeout(()=>{
      s.remove();
      reject(new Error('Timed out loading '+src));
    },15000);
    s.src=src;
    s.onload=()=>{clearTimeout(timer);resolve()};
    s.onerror=()=>{clearTimeout(timer);reject(new Error('Could not load '+src))};
    d.head.appendChild(s);
  });
}

/*
FUNCTION: installBridge

WHAT THE CODE DOES:
Injects temporary scoreboard functions before Firebase is ready. Buttons show a
connecting message, and geoScoreContext exposes the completed game's time,
station, and mode to the scoreboard client.

WHY IT EXISTS:
The inner game can call stable function names without knowing whether external
Firebase scripts have finished downloading.
*/
function installBridge(){
  const d=frame.contentDocument;
  const s=d.createElement('script');
  s.textContent=`(()=>{
    window.geoScoreContext=()=>({
      responseTimeSeconds:Number(elapsed.toFixed(1)),
      station:station&&station.name?station.name:'Unknown Station',
      callType:typeof modeName==='function'?modeName():'Random Shift'
    });
    const msg=(id,text)=>{
      show(id);
      const list=document.querySelector('#'+id+' .list');
      if(list)list.innerHTML='<p class="muted" style="text-align:center">'+text+'</p>';
    };
    window.showPersonalScores=()=>msg('scores','Connecting to the online scoreboard…');
    window.showCityTenScores=()=>msg('city-ten-scores','Connecting to the online scoreboard…');
    window.saveScore=()=>alert('The online scoreboard is loading.');
    window.geoScoreboardFailure=e=>{
      const text='Scoreboard error: '+(e&&e.message?e.message:String(e));
      window.showPersonalScores=()=>msg('scores',text);
      window.showCityTenScores=()=>msg('city-ten-scores',text);
      window.saveScore=()=>alert(text);
    };
  })();`;
  d.body.appendChild(s);
}

/*
FUNCTION: installClients

WHAT THE CODE DOES:
Installs the bridge, loads Firebase app and Firestore compatibility libraries only
when missing, then loads the project's scoreboard client and verifies its ready
flag.

FALLBACK:
Failure is reported inside scoreboard controls; it does not stop local guessing.
*/
async function installClients(){
  const g=child();
  const base=location.href;
  const scoreboardUrl=new URL('../firebase-scoreboard-compat.js?v='+VERSION,base).href;
  installBridge();
  if(!g.firebase?.initializeApp)await addScript('https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js');
  if(!g.firebase?.firestore)await addScript('https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js');
  await addScript(scoreboardUrl);
  if(!g.__geoScoreboardReady)throw new Error('Scoreboard client did not finish installing.');
}

/*
IFRAME LOAD FLOW:
Wait for the inner game function, attempt the shared dispatch store, remove the
loading layer, then install the optional online scoreboard in the background.
*/
frame.addEventListener('load',async()=>{
  if(typeof child()?.show!=='function')return;
  try{
    await window.PTBO_DISPATCH_STORE.ready();
  }catch(e){
    console.error('Unable to load shared dispatch data.',e);
  }
  loading.classList.add('hidden');
  setTimeout(()=>loading.remove(),250);
  installClients().catch(e=>{
    console.error(e);
    child()?.geoScoreboardFailure?.(e);
  });
});
})();
</script>
</body>
</html>
