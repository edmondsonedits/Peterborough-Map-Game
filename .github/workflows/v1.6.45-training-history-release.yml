name: v1.6.45 Training History Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v1.6.45 training history wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '1.6.45';

          function rewrite(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: expected v1.6.45 transformation did not change the file`);
            fs.writeFileSync(file, after);
            console.log(`${file}: updated`);
          }

          rewrite('response-simulator/training-history-1.6.45.js', text => {
            const pattern = /  function loadEntries\(\) \{[\s\S]*?\n  \}\n\n  function saveEntries/;
            if (!pattern.test(text)) throw new Error('Training-history storage anchor changed');
            return text.replace(pattern, `  function loadEntries() {
    if (!state.storageAvailable && memory.length) return memory.slice();
    try {
      const raw = localStorage?.getItem?.(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(parsed)) return [];
      const clean = parsed.slice(0, MAX_ENTRIES);
      state.storageAvailable = true;
      memory.splice(0, memory.length, ...clean);
      return clean;
    } catch (_) {
      state.storageAvailable = false;
      return memory.slice();
    }
  }

  function saveEntries`);
          });

          rewrite('shared/build-version.js', text => {
            let next = text.replace(/const VERSION = '\d+\.\d+\.\d+';/, `const VERSION = '${VERSION}';`);
            const incidentLine = "            optionalInnerModule(doc, 'ptbo-incident-formatting-loader', `../response-simulator/incident-formatting-1.6.44.js?v=${VERSION}`, '', 6000),";
            const historyLine = "            optionalInnerModule(doc, 'ptbo-training-history-loader', `../response-simulator/training-history-1.6.45.js?v=${VERSION}`, '', 6000),";
            if (!next.includes(incidentLine)) throw new Error('Incident formatter loader anchor changed');
            if (next.includes(historyLine)) throw new Error('Training history loader already present');
            next = next.replace(incidentLine, `${incidentLine}\n${historyLine}`);
            return next;
          });

          for (const file of [
            'index.html',
            'response-simulator/play/index.html',
            'response-simulator/mobile/index.html',
            'geo-guesser/index.html',
            'city-explorer/index.html',
          ]) {
            rewrite(file, text => text.replace(/build-version\.js\?v=\d+\.\d+\.\d+/g, `build-version.js?v=${VERSION}`));
          }

          for (const file of [
            'geo-guesser/desktop/index.html',
            'geo-guesser/mobile/index.html',
            'geo-guesser/online/index.html',
          ]) {
            rewrite(file, text => text
              .replace(/build-version\.js\?v=\d+\.\d+\.\d+/g, `build-version.js?v=${VERSION}`)
              .replace(/const VERSION\s*=\s*'\d+\.\d+\.\d+'/, `const VERSION = '${VERSION}'`));
          }

          rewrite('response-simulator/index.html', text => {
            const anchor = "            mission.phase = 'complete';\n            simulationState = STATES.INSERVICE;\n            totalTrackedCalls++;";
            if (!text.includes(anchor)) throw new Error('completeAssignment history anchor changed');
            const replacement = `            mission.phase = 'complete';
            simulationState = STATES.INSERVICE;
            const historySnapshot = {
                generation: mission.generation,
                service: mission.service,
                scene: mission.scene ? {...mission.scene} : null,
                hospital: mission.hospital ? {...mission.hospital} : null,
                responseMs: mission.responseMs,
                transportMs: mission.transportMs,
                completedAt: Date.now()
            };
            if (window.PTBO_TRAINING_HISTORY?.recordCompletion) window.PTBO_TRAINING_HISTORY.recordCompletion(historySnapshot);
            else (window.PTBO_PENDING_TRAINING_HISTORY ||= []).push(historySnapshot);
            totalTrackedCalls++;`;
            return text.replace(anchor, replacement);
          });
          NODE

      - name: Check local training history
        run: node --test tests/training-history.test.cjs

      - name: Verify production regression suite
        run: |
          node --test tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/incident-formatting.test.cjs tests/training-history.test.cjs tests/analytics-authority.test.cjs tests/analytics-bootstrap.test.cjs tests/analytics-adversarial.test.cjs tests/release-bootstrap-consistency.test.cjs
          node --test --test-skip-pattern='v1\.6\.31 build uses|main menu exposes|v1\.6\.25 analytics reliably|v1\.6\.28 visual tutorial shows' tests/base-training-cities.test.cjs
          for pass in 1 2 3 4 5; do node --test tests/ems.test.cjs >/dev/null; done

      - name: Commit v1.6.45 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add response-simulator/training-history-1.6.45.js response-simulator/index.html shared/build-version.js index.html response-simulator/play/index.html response-simulator/mobile/index.html geo-guesser/index.html geo-guesser/desktop/index.html geo-guesser/mobile/index.html geo-guesser/online/index.html city-explorer/index.html
          git commit -m "Release v1.6.45 local training history"
          git push origin main
