name: Validate street paint correction
on:
  push:
    branches: [fix/street-marking-evidence-2026-10-10]
    paths: [.github/workflows/street-paint-validation.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: street-paint-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/street-marking-evidence-2026-10-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce failures before applying the fix
        run: |
          mkdir -p artifacts/street-paint-qa
          if node tools/test_street_marking_evidence.mjs > artifacts/street-paint-qa/before-tests.log 2>&1; then
            echo 'Expected the unmodified renderer to fail the new regression cases.'
            exit 1
          fi
          tail -20 artifacts/street-paint-qa/before-tests.log
      - name: Apply guarded changes to isolated checkout
        run: python tools/apply_street_paint_update.py
      - name: Run new and existing regression suites
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module --check < city-explorer/app.js
          node tools/test_street_marking_evidence.mjs | tee artifacts/street-paint-qa/after-tests.log
          node tools/test_city_detail_rules.mjs
          node tools/test_citywide_road_quality.mjs
          node tools/test_fallback_junction_geometry.mjs
          node tools/test_station_road_detail.mjs
          node tools/test_gameplay_systems.mjs
          node tools/test_rendered_pavement.mjs
          node tools/test_official_road_surface_index.mjs
          node tools/geospatial/test_road_network.mjs
          node tools/geospatial/test_road_terrain_clearance.mjs
          node tools/geospatial/test_official_road_surfaces.mjs
      - uses: actions/download-artifact@v4
        with:
          name: peterborough-street-evidence
          run-id: 38091959919
          github-token: ${{ github.token }}
          path: artifacts/source-evidence
      - name: Regenerate all-road evidence inventory
        run: |
          python -m pip install --disable-pip-version-check shapely pyproj
          python tools/audit_street_lane_evidence.py artifacts/source-evidence/orn-lane-events.json
          cp artifacts/source-evidence/imagery-receipt.json docs/street-audit/imagery-receipt.json
      - name: Prepare matching baseline and browser runtime
        run: |
          git fetch --depth=1 origin 3a9f333270bd8d832e5651d6b4cda4125e90d32c
          git worktree add --detach "$RUNNER_TEMP/ptbo-baseline" 3a9f333270bd8d832e5651d6b4cda4125e90d32c
          npm install --prefix "$RUNNER_TEMP/ptbo-qa" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/ptbo-qa/node_modules/.bin/playwright" install chromium
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/street-after-http.log 2>&1 &
          python3 -m http.server 4175 --bind 127.0.0.1 --directory "$RUNNER_TEMP/ptbo-baseline" > /tmp/street-before-http.log 2>&1 &
          sleep 2
      - name: Verify browser startup and driving
        env:
          NODE_PATH: ${{ runner.temp }}/ptbo-qa/node_modules
          PTBO_QA_ARTIFACT_DIR: artifacts/street-paint-qa/driving
        run: |
          node tools/check-road-preview-smoke.cjs http://127.0.0.1:4174
          node tools/check-station-driving.cjs http://127.0.0.1:4174 street-paint-ci
      - name: Verify mobile controls
        env:
          NODE_PATH: ${{ runner.temp }}/ptbo-qa/node_modules
          PTBO_QA_ARTIFACT_DIR: artifacts/street-paint-qa/mobile
        run: node tools/check-mobile-controls.cjs http://127.0.0.1:4174 street-paint-mobile-ci
      - name: Capture matched street comparisons
        env:
          NODE_PATH: ${{ runner.temp }}/ptbo-qa/node_modules
          PTBO_QA_ARTIFACT_DIR: artifacts/street-paint-qa/comparison
        run: node tools/check-street-paint-comparison.cjs http://127.0.0.1:4175 http://127.0.0.1:4174
      - name: Commit verified code and evidence inventory to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add city-explorer/app.js city-explorer/city-detail-rules.js city-explorer/road-network.js city-explorer/index.html city-explorer/road-orientation-fix.js tools/test_city_detail_rules.mjs docs/street-audit/
          git rm tools/apply_street_paint_update.py .github/workflows/street-paint-validation.yml
          git commit -m 'Apply tested evidence-based street paint and all-road lane audit'
          git push origin HEAD:fix/street-marking-evidence-2026-10-10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-paint-validation
          path: |
            artifacts/street-paint-qa/
            docs/street-audit/
            /tmp/street-after-http.log
            /tmp/street-before-http.log
          retention-days: 7
