name: Integrate reviewed street paint
on:
  push:
    branches: [fix/street-marking-evidence-2026-10-10]
    paths: [.github/workflows/street-paint-integration.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/street-marking-evidence-2026-10-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate current main with reviewed conflict resolution
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          # Reuse the immutable, reviewed cap/contact patch recipe. Only the
          # inspected merge-conflict handler changes; no source is discarded.
          source=subprocess.check_output(['git','show','f0296dceb90e07010197cde64d115283c3862a20:.github/workflows/street-paint-integration.yml'],text=True)
          rows=source.splitlines()
          start=next(i for i,s in enumerate(rows) if s.strip()=='- name: Preserve concurrent main changes and apply verified cap-height correction')
          begin=next(i for i in range(start,len(rows)) if rows[i].strip()=='run: |')+1
          end=next(i for i in range(begin,len(rows)) if rows[i].startswith('      - name:'))
          command='\n'.join(s[10:] for s in rows[begin:end])+'\n'
          first=command.index("result=subprocess.run(['git','merge','--no-commit','--no-ff','origin/main'])")
          last=command.index("p=Path('city-explorer/road-orientation-fix.js')",first)
          command=command[:first]+"subprocess.run(['python','tools/resolve_street_merge.py'],check=True)\n"+command[last:]
          # Keep main's tested canonical build-token contract, not a parallel
          # app version scheme. The HTML entrypoint and helper imports version
          # the changed street renderer without discarding release behaviour.
          command=command.replace("encodeURIComponent(appVersion + '-street-evidence-2')", "encodeURIComponent(appVersion)")
          subprocess.run(['bash','-e','-o','pipefail','-c',command],check=True)
          PY
      - name: Test combined source, geometry and runtime edge cases
        run: |
          node --input-type=module --check < city-explorer/app.js
          node tools/test_street_marking_evidence.mjs
          node tools/test_street_paint_runtime_edges.mjs
          node tools/test_city_detail_rules.mjs
          node tools/test_citywide_road_quality.mjs
          node tools/test_fallback_junction_geometry.mjs
          node tools/test_station_road_detail.mjs
          node tools/test_gameplay_systems.mjs
          node tools/test_rendered_pavement.mjs
          node tools/geospatial/test_road_network.mjs
          node tools/geospatial/test_road_terrain_clearance.mjs
          node --test tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/city-search-quality.test.cjs tests/route-decisions-integration.test.cjs
      - name: Refresh audit against the merged source snapshot
        run: |
          python -m pip install --disable-pip-version-check shapely pyproj
          python tools/audit_street_lane_evidence.py docs/street-audit/orn-lane-events.json
      - name: Prepare browser servers
        run: |
          npm install --prefix "$RUNNER_TEMP/ptbo-qa" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/ptbo-qa/node_modules/.bin/playwright" install chromium
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/street-after-http.log 2>&1 &
          python3 -m http.server 4175 --bind 127.0.0.1 --directory "$RUNNER_TEMP/current-main" > /tmp/street-before-http.log 2>&1 &
          sleep 2
      - name: Verify combined driving and mobile controls
        env:
          NODE_PATH: ${{ runner.temp }}/ptbo-qa/node_modules
          PTBO_QA_ARTIFACT_DIR: artifacts/street-integration/driving
        run: |
          node tools/check-road-preview-smoke.cjs http://127.0.0.1:4174
          node tools/check-station-driving.cjs http://127.0.0.1:4174 street-integration
          PTBO_QA_ARTIFACT_DIR=artifacts/street-integration/mobile node tools/check-mobile-controls.cjs http://127.0.0.1:4174 street-integration-mobile
      - name: Verify real municipal road appearance and reviewed source IDs
        env:
          NODE_PATH: ${{ runner.temp }}/ptbo-qa/node_modules
          PTBO_QA_ARTIFACT_DIR: artifacts/street-integration/comparison
        run: node tools/check-street-paint-comparison.cjs http://127.0.0.1:4175 http://127.0.0.1:4174
      - name: Commit tested integration on the feature branch
        run: |
          git add city-explorer/app.js city-explorer/road-orientation-fix.js city-explorer/index.html tools/check-street-paint-comparison.cjs docs/street-audit/
          git rm .github/workflows/street-paint-integration.yml tools/resolve_street_merge.py
          git commit -m 'Merge current main and verify evidence-correct street paint on actual municipal surfaces'
          git push origin HEAD:fix/street-marking-evidence-2026-10-10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-paint-integration
          path: |
            artifacts/street-integration/
            docs/street-audit/
            /tmp/street-after-http.log
            /tmp/street-before-http.log
          retention-days: 7
