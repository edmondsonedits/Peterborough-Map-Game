name: v1.6.43 Deterministic EMS Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v1.6.43 release hardening
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '1.6.43';

          function rewrite(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: expected release transformation did not change the file`);
            fs.writeFileSync(file, after);
            console.log(`${file}: updated`);
          }

          rewrite('shared/build-version.js', text => text.replace(/const VERSION = '\d+\.\d+\.\d+';/, `const VERSION = '${VERSION}';`));

          for (const file of [
            'index.html',
            'response-simulator/play/index.html',
            'response-simulator/mobile/index.html',
            'geo-guesser/index.html',
            'city-explorer/index.html',
          ]) {
            rewrite(file, text => text.replace(/build-version\.js\?v=\d+\.\d+\.\d+/g, `build-version.js?v=${VERSION}`));
          }

          for (const file of [
            'geo-guesser/desktop/index.html',
            'geo-guesser/mobile/index.html',
            'geo-guesser/online/index.html',
          ]) {
            rewrite(file, text => text
              .replace(/build-version\.js\?v=\d+\.\d+\.\d+/g, `build-version.js?v=${VERSION}`)
              .replace(/const VERSION\s*=\s*'\d+\.\d+\.\d+';/, `const VERSION = '${VERSION}';`));
          }

          rewrite('tests/ems.test.cjs', text => {
            const old = "function game() {\n  let time=0,serial=0;\n  const timers=new Map(),intervals=new Map(),elements=new Map(),spoken=[],alerts=[];";
            const replacement = "function game({random=0}={}) {\n  let time=0,serial=0;\n  const timers=new Map(),intervals=new Map(),elements=new Map(),spoken=[],alerts=[];\n  // Keep dispatch selection deterministic. A randomly selected scene near the hospital can\n  // legitimately complete the transport transition immediately and make unrelated tests flaky.\n  const testMath=Object.create(Math);\n  testMath.random=()=>random;";
            if (!text.includes(old)) throw new Error('EMS harness anchor changed');
            text = text.replace(old, replacement);
            const contextOld = "const c=vm.createContext({console,URL,performance:{now:()=>time},Event:class{},CustomEvent:class{},";
            const contextNew = "const c=vm.createContext({console,URL,Math:testMath,performance:{now:()=>time},Event:class{},CustomEvent:class{},";
            if (!text.includes(contextOld)) throw new Error('EMS VM context anchor changed');
            return text.replace(contextOld, contextNew);
          });

          rewrite('.github/workflows/deploy-pages.yml', text => {
            const anchor = "          node --test --test-skip-pattern='v1\\.6\\.31 build uses|main menu exposes|v1\\.6\\.25 analytics reliably|v1\\.6\\.28 visual tutorial shows' tests/base-training-cities.test.cjs\n\n      - name: Configure Pages";
            const replacement = "          node --test --test-skip-pattern='v1\\.6\\.31 build uses|main menu exposes|v1\\.6\\.25 analytics reliably|v1\\.6\\.28 visual tutorial shows' tests/base-training-cities.test.cjs\n\n      - name: Stress deterministic EMS transitions\n        run: |\n          for pass in 1 2 3 4 5; do\n            node --test tests/ems.test.cjs >/dev/null\n          done\n\n      - name: Configure Pages";
            if (!text.includes(anchor)) throw new Error('Pages workflow anchor changed');
            return text.replace(anchor, replacement);
          });
          NODE

      - name: Stress EMS transition determinism before commit
        run: |
          for pass in $(seq 1 25); do
            node --test tests/ems.test.cjs >/dev/null
          done

      - name: Verify production regression suite
        run: |
          node --test tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/analytics-authority.test.cjs tests/analytics-bootstrap.test.cjs tests/analytics-adversarial.test.cjs tests/release-bootstrap-consistency.test.cjs
          node --test --test-skip-pattern='v1\.6\.31 build uses|main menu exposes|v1\.6\.25 analytics reliably|v1\.6\.28 visual tutorial shows' tests/base-training-cities.test.cjs

      - name: Commit v1.6.43 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/build-version.js index.html response-simulator/play/index.html response-simulator/mobile/index.html geo-guesser/index.html geo-guesser/desktop/index.html geo-guesser/mobile/index.html geo-guesser/online/index.html city-explorer/index.html tests/ems.test.cjs .github/workflows/deploy-pages.yml
          git commit -m "Release v1.6.43 deterministic EMS CI hardening"
          git push origin main
