name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Peterborough geospatial assets']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event == 'pull_request') && format('pages-ignored-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize production release
        run: node scripts/normalize-release.cjs

      - name: Check structured location report state and UI
        run: |
          npm ci --prefix tools/location-report-tests --ignore-scripts --no-audit
          node --test tests/feedback-model.test.mjs tests/feedback-demo-requests.test.mjs tests/feedback-workflow.test.mjs tests/feedback-agent-tools.test.mjs tests/feedback-transfer.test.mjs tests/location-report-model.test.mjs tests/location-circle.test.mjs tests/geo-location-report.test.cjs tests/location-report-ui.test.mjs tests/location-report-flow.test.mjs

      - name: Check gameplay regressions
        run: |
          node --test tests/steering-pointer-owner.test.cjs tests/optional-preference-storage.test.cjs tests/city-selector-recovery.test.cjs tests/frame-input-recovery.test.cjs
          node --check shared/legacy-release-forwarder.js
          for file in shared/release-bootstrap-*.js; do node --check "$file"; done
          node --test tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/incident-formatting.test.cjs tests/training-history.test.cjs tests/geo-map-policy.test.cjs tests/analytics-authority.test.cjs tests/analytics-bootstrap.test.cjs tests/analytics-adversarial.test.cjs tests/release-bootstrap-consistency.test.cjs tests/tablet-dispatch-minimize.test.cjs tests/tablet-button-stability.test.cjs tests/base-editor-freeze.test.cjs tests/ci-workflow-scope.test.cjs
          node --test tests/base-training-cities.test.cjs tests/desktop-editor-steering-regression.test.cjs tests/mode-quality.test.mjs tests/route-response-quality.test.cjs tests/async-release-quality.test.cjs tests/city-search-quality.test.cjs tests/analytics-transport-quality.test.cjs tests/route-tracing.test.cjs tests/route-learning.test.cjs tests/route-decisions-integration.test.cjs tests/route-tuning.test.cjs tests/route-gestures.test.cjs tests/live-route-tracing.test.cjs tests/route-junction-regression.test.cjs tests/route-short-segments.test.cjs
          node --test tests/homepage.test.cjs tests/mobile-camera-follow.test.cjs tests/city-demo-access.test.cjs tests/dispatch-intersections.test.cjs
          node --test tests/shared-call-catalog.test.cjs tests/geo-station-practice.test.cjs tests/geo-station-integration.test.cjs tests/geo-station-flow.test.cjs tests/geo-focus-flow.test.cjs tests/geo-wrapper-readiness.test.cjs tests/geo-peterborough-hud.test.cjs tests/geo-shared-compact.test.cjs
          node --test tests/driving-route-guidance.test.cjs tests/route-city-bootstrap.test.cjs

      - name: Check city editor recovery and loading
        run: node --test tools/test_city_editor_ai_tools.mjs tools/test_city_editor_ai_camera.mjs tools/test_city_editor_ai_appearance.mjs tools/test_city_editor_ai_bounds.mjs tools/test_city_editor_ai_integration.mjs tools/test_city_editor_state.mjs tools/test_city_editor_draft_identity.mjs tools/test_city_editor_draft_lifecycle.mjs tools/test_city_editor_publisher_client.mjs tools/test_city_editor_recovery_prompt.mjs tools/test_city_editor_integration.mjs tools/test_city_editor_interactions.mjs tools/test_city_editor_release.mjs

      - name: Check Ontario city demos and demo requests
        run: node --test tests/ontario-city-data.test.cjs tests/editor-city-runtime.test.cjs tests/geo-city-runtime.test.cjs tests/geo-city-flow.test.cjs tests/demo-requests.test.cjs

      - name: Check every city road asset and shared EMS priority
        run: node --test tests/city-training-data.test.cjs tests/ems-priority.test.cjs tests/ems-training-store.test.cjs tests/route-base-access.test.cjs tests/route-local-calls.test.cjs tests/route-search-workspace.test.cjs tests/route-road-supplement.test.cjs tests/route-local-data.test.cjs tests/route-station-selection.test.cjs

      - name: Check streetscape regressions
        run: node --test tests/footage-building-massing.test.mjs tests/route-building-frontages.test.mjs tests/business-building-match.test.mjs tests/business-sign-layout.test.mjs tests/business-sign-renderer.test.mjs tests/video-building-frontages.test.mjs tests/sherbrooke-frontage-v2.test.mjs tests/sherbrooke-facade-assets.test.mjs tests/sherbrooke-footage-roofs.test.mjs tests/sherbrooke-footage.test.mjs tests/sherbrooke-editor-link.test.mjs tests/sherbrooke-plan.test.mjs tests/sherbrooke-fallback.test.mjs tests/station-reference-details.test.mjs tests/streetscape-assets.test.mjs tests/vegetation-variants.test.mjs tests/city-feature-utils.test.mjs

      - name: Check reusable city visuals, roads and holograms
        run: node --test tests/city-building-appearance.test.mjs tests/city-material-library.test.mjs tests/city-visual-settings.test.mjs tests/corridor-recording-appearances.test.mjs tests/cricket-recording-appearances.test.mjs tests/cricket-runtime-integration.test.mjs tests/hunter-bridge-appearance.test.mjs tests/hunter-bridge-surface.test.mjs tests/intersection-hologram-rules.test.mjs tests/intersection-holograms.test.mjs tests/recording-appearance-integration.test.mjs tests/recording-arched-openings.test.mjs tests/recording-facade-runtime.test.mjs tests/recording-photo-assets.test.mjs tests/recording-reference-appearances.test.mjs tests/recording-surface-appearance.test.mjs tests/reviewed-photo-appearance.test.mjs tests/road-appearance-rules.test.mjs tests/road-curb-appearance.test.mjs tests/road-material-polish.test.mjs tests/road-surface-selection.test.mjs tests/roadside-furniture-geometry.test.mjs tests/roadside-furniture-placement.test.mjs tests/sherbrooke-pole-placement.test.mjs tests/web-building-frontages.test.mjs

      - name: Check authored actors and station architecture
        run: node --test tests/pumper-asset.test.mjs tests/firefighter-asset.test.mjs tests/station-architecture.test.mjs tests/station-one.test.mjs tests/station-one-editor-restore.test.mjs tests/station-two.test.mjs tests/station-two-user-spawn.test.mjs tests/station-three-bay-departure.test.mjs tests/station-three-runtime.test.mjs tests/emergency-facilities.test.mjs

      - name: Stress deterministic EMS transitions
        run: |
          for pass in 1 2 3 4 5; do
            node --test tests/ems.test.cjs >/dev/null
          done

      - name: Verify connected roads and road-pack asset
        run: |
          node --test tests/connected-road-surface.test.mjs tests/graphics-quality.test.mjs tests/road-appearance-rules.test.mjs tests/road-pack-build.test.mjs tests/road-pack-export.test.mjs tests/road-pack-optimize.test.mjs tests/road-pack-verifier.test.mjs tests/road-paint-geometry.test.mjs tests/road-recovery.test.mjs tests/road-stacked-ownership.test.mjs tests/road-surface-finish.test.mjs tests/road-tile-layer.test.mjs tests/road-tile-pack.test.mjs tests/streamed-road-bindings.test.mjs
          node tools/test_fallback_junction_geometry.mjs
          node tools/test_rendered_pavement.mjs
          node tools/test_street_paint_runtime_edges.mjs
          node --test tests/road-marking-paths.test.mjs tests/road-marking-layout.test.mjs tests/road-marking-projection.test.mjs tests/road-marking-pack.test.mjs tests/road-marking-pack-finish.test.mjs tests/road-marking-finalization-inputs.test.mjs
          node tools/verify-road-pack.mjs
          node tools/verify-road-markings.mjs

      - name: Stage production Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'scripts/' \
            --exclude 'test-artifacts/' \
            --exclude 'artifacts/'
          test -f _site/index.html
          test -f _site/city-explorer/index.html
          test -f _site/response-simulator/index.html
          test -f _site/route-mapping/play.html
          test -f _site/route-mapping/station-core.js
          test -f _site/route-mapping/stations.js
          test -f _site/docs/ANALYTICS-PRIVACY-SECURITY.md
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/tests
          test ! -e _site/tools
          test ! -e _site/scripts
          test ! -e _site/test-artifacts
          test ! -e _site/artifacts
          node -e "const fs=require('node:fs'); for(const city of fs.readdirSync('cities')) { const file='cities/'+city+'/training-data.json'; if(!fs.existsSync(file)) continue; const data=JSON.parse(fs.readFileSync(file)); for(const asset of [file,data.roadsUrl,'shared/ems-priority.js']) if(!fs.existsSync('_site/'+asset)) throw Error('Missing published training asset: '+asset); }"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
