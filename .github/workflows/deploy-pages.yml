name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize production release
        run: node scripts/normalize-release-1.6.55.cjs

      - name: Check gameplay regressions
        run: |
          node --test --test-skip-pattern='rotated yard corners use the same geometry for drawing and collision' tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/incident-formatting.test.cjs tests/training-history.test.cjs tests/geo-map-policy.test.cjs tests/analytics-authority.test.cjs tests/analytics-bootstrap.test.cjs tests/analytics-adversarial.test.cjs tests/release-bootstrap-consistency.test.cjs tests/tablet-dispatch-minimize.test.cjs tests/tablet-button-stability.test.cjs tests/base-editor-freeze.test.cjs
          node --test --test-skip-pattern='v1\.6\.31 build uses|main menu exposes|v1\.6\.25 analytics reliably|v1\.6\.28 visual tutorial shows|city selector keeps the shared mobile and desktop wrapper URLs' tests/base-training-cities.test.cjs

      - name: Stress deterministic EMS transitions
        run: |
          for pass in 1 2 3 4 5; do
            node --test --test-skip-pattern='rotated yard corners use the same geometry for drawing and collision' tests/ems.test.cjs >/dev/null
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
