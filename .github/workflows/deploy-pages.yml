name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize production release
        run: node scripts/normalize-release.cjs

      - name: Check gameplay regressions
        run: |
          node --check shared/legacy-release-forwarder.js
          for file in shared/release-bootstrap-*.js; do node --check "$file"; done
          node --test tests/critical-gameplay.test.cjs tests/gearbox.test.cjs tests/camera-zoom.test.cjs tests/ems.test.cjs tests/incident-formatting.test.cjs tests/training-history.test.cjs tests/geo-map-policy.test.cjs tests/analytics-authority.test.cjs tests/analytics-bootstrap.test.cjs tests/analytics-adversarial.test.cjs tests/release-bootstrap-consistency.test.cjs tests/tablet-dispatch-minimize.test.cjs tests/tablet-button-stability.test.cjs tests/base-editor-freeze.test.cjs tests/ci-workflow-scope.test.cjs
          node --test tests/base-training-cities.test.cjs tests/desktop-editor-steering-regression.test.cjs

      - name: Check streetscape regressions
        run: node --test tests/sherbrooke-plan.test.mjs tests/sherbrooke-fallback.test.mjs tests/station-reference-details.test.mjs tests/streetscape-assets.test.mjs tests/vegetation-variants.test.mjs tests/city-feature-utils.test.mjs

      - name: Check authored actors and station architecture
        run: node --test tests/pumper-asset.test.mjs tests/firefighter-asset.test.mjs tests/station-architecture.test.mjs

      - name: Stress deterministic EMS transitions
        run: |
          for pass in 1 2 3 4 5; do
            node --test tests/ems.test.cjs >/dev/null
          done

      - name: Stage production Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'scripts/' \
            --exclude 'test-artifacts/'
          test -f _site/index.html
          test -f _site/city-explorer/index.html
          test -f _site/response-simulator/index.html
          test -f _site/docs/ANALYTICS-PRIVACY-SECURITY.md
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/tests
          test ! -e _site/tools
          test ! -e _site/scripts
          test ! -e _site/test-artifacts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
