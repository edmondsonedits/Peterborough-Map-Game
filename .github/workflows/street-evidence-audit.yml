name: Peterborough street evidence audit
on:
  workflow_dispatch:
  push:
    branches: [fix/street-marking-evidence-2026-10-10]
    paths: [.github/workflows/street-evidence-audit.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve source lane events and aerial review references
        shell: bash
        run: |
          mkdir -p artifacts/street-evidence
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          root=Path('artifacts/street-evidence')
          base='https://ws.lioservices.lrc.gov.on.ca/arcgis1071a/rest/services/LIO_OPEN_DATA/LIO_Open09/MapServer/6'
          source=json.loads(Path('city-explorer/data/orn-roads.geojson').read_text())
          ids=sorted({int(f['properties']['OGF_ID']) for f in source['features'] if f['properties'].get('OGF_ID') is not None})
          def get(url,params):
              req=urllib.request.Request(url+'?'+urllib.parse.urlencode(params),headers={'User-Agent':'Peterborough-Map-Game/evidence-audit'})
              with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
              if data.get('error'): raise RuntimeError(data['error'])
              return data
          metadata=get(base,{'f':'json'})
          (root/'orn-lane-layer.json').write_text(json.dumps(metadata,indent=2))
          def chunk(chunk_ids):
              rows=[]; offset=0
              while True:
                  data=get(base+'/query',{'f':'json','where':'ORN_ROAD_NET_ELEMENT_ID IN ('+','.join(map(str,chunk_ids))+')','outFields':'*','returnGeometry':'false','resultOffset':offset,'resultRecordCount':2000,'orderByFields':'EVENT_ID'})
                  page=data.get('features',[])
                  rows.extend(item['attributes'] for item in page)
                  if not data.get('exceededTransferLimit'): break
                  if not page: raise RuntimeError('Empty incomplete lane page')
                  offset+=len(page)
              return rows
          groups=[ids[i:i+40] for i in range(0,len(ids),40)]
          rows=[]
          with ThreadPoolExecutor(max_workers=3) as pool:
              for result in pool.map(chunk,groups): rows.extend(result)
          rows=list({r['EVENT_ID']:r for r in rows}.values())
          receipt={'source':base,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requestedRoadIds':len(ids),'returnedEvents':len(rows),'matchedRoadIds':len({r['ORN_ROAD_NET_ELEMENT_ID'] for r in rows}),'events':rows}
          (root/'orn-lane-events.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps({k:v for k,v in receipt.items() if k!='events'},indent=2))
          imagery='https://ws.lioservices.lrc.gov.on.ca/arcgis2/rest/services/LIO_Imagery/Ontario_Imagery_Web_Map_Service/MapServer'
          sites=[('sherbrooke-station',44.30080,-78.32212),('george-downtown',44.3045,-78.3200),('water-downtown',44.3032,-78.3185),('lansdowne-west',44.2742,-78.3777),('chemong',44.3206,-78.3328),('parkhill-west',44.3117,-78.3367),('aylmer',44.3022,-78.3241),('park-street',44.3040,-78.3278)]
          images=[]
          for name,lat,lon in sites:
              bbox=[lon-.0016,lat-.00085,lon+.0016,lat+.00085]
              params={'f':'image','bbox':','.join(map(str,bbox)),'bboxSR':4326,'imageSR':3857,'size':'1400,1000','format':'jpg','transparent':'false'}
              url=imagery+'/export?'+urllib.parse.urlencode(params)
              entry={'name':name,'bbox':bbox,'source':imagery,'request':url,'imageryDate':'Service mosaic; inspect source metadata, not guaranteed 2026'}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Peterborough-Map-Game/evidence-audit'}),timeout=30) as response: payload=response.read()
                  if not payload.startswith(b'\xff\xd8'): raise ValueError('Response is not JPEG')
                  (root/(name+'.jpg')).write_bytes(payload);entry['status']='downloaded'
              except Exception as exc: entry['status']='unavailable';entry['error']=str(exc)
              images.append(entry)
          (root/'imagery-receipt.json').write_text(json.dumps(images,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peterborough-street-evidence
          path: artifacts/street-evidence/
          retention-days: 7
