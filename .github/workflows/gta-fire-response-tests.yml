name: GTA Fire Response checks

on:
  pull_request:
    paths:
      - 'gta-fire-response/**'
      - 'tests/gta-fire-response/**'
      - 'docs/gta-fire-response/**'
      - '.github/workflows/gta-fire-response-tests.yml'
  push:
    branches: [main]
    paths:
      - 'gta-fire-response/**'
      - 'tests/gta-fire-response/**'
      - 'docs/gta-fire-response/**'
      - '.github/workflows/gta-fire-response-tests.yml'

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete Phase 1–5 checks
        run: bash tests/gta-fire-response/run-phase5-checks.sh

  chromium-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        working-directory: tests/gta-fire-response
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run complete Phase 1–5 Chromium journeys
        working-directory: tests/gta-fire-response
        run: npm run test:e2e
