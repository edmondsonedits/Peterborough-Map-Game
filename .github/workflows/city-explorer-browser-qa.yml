name: City Explorer Browser QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'city-explorer/**'
      - 'tools/**'
      - '.github/workflows/city-explorer-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check-station-driving.cjs'
      - 'tools/check-mobile-controls.cjs'
      - 'tools/check-multitouch-controls.cjs'
      - 'tools/check-authored-scene.cjs'
      - 'tools/check-driving-upgrade.mjs'
      - 'tools/check-multiplayer-driving-upgrade.mjs'
      - 'tools/test_authored_scene_runtime.mjs'
      - 'tools/test_street_*.mjs'
      - 'city-explorer/app.js'
      - 'city-explorer/street-paint.js'
      - 'city-explorer/city-detail-rules.js'
      - 'city-explorer/road-network.js'
      - 'city-explorer/feature-utils.js'
      - 'city-explorer/authored-scene-*.js'
      - 'city-explorer/data/authored/**'
      - 'city-explorer/gameplay-systems*.js'
      - 'city-explorer/driving-refinement*.js'
      - 'city-explorer/mobile-controls*.js'
      - 'city-explorer/mobile-controls*.css'
      - 'city-explorer/road-orientation-fix.js'
      - 'city-explorer/release.js'
      - 'city-explorer/release-*.js'
      - '.github/workflows/city-explorer-browser-qa.yml'

permissions:
  contents: read

concurrency:
  group: city-explorer-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-refresh-captures:
    # Both snapshots belong to this repository. Do not run a fork's proposed
    # workflow/runtime with credentials or expand this to pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [balanced, lite]
    env:
      VISUAL_REFRESH_BASELINE: 4da1b86bad3f14b27abb05392c44e5c38fc6bef7
      PTBO_QA_ARTIFACT_DIR: artifacts/visual-refresh
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the same browser runtime for all variants
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Prepare an untouched baseline archive and both servers
        id: visual-servers
        run: |
          mkdir -p "$RUNNER_TEMP/ptbo-visual-baseline" artifacts/visual-refresh/server
          git cat-file -e "$VISUAL_REFRESH_BASELINE^{commit}"
          git archive "$VISUAL_REFRESH_BASELINE" | tar -x -C "$RUNNER_TEMP/ptbo-visual-baseline"
          python3 -m http.server 4174 --bind 127.0.0.1 > artifacts/visual-refresh/server/current-http.log 2>&1 &
          echo $! > "$RUNNER_TEMP/ptbo-visual-current.pid"
          python3 -m http.server 4175 --bind 127.0.0.1 --directory "$RUNNER_TEMP/ptbo-visual-baseline" > artifacts/visual-refresh/server/baseline-http.log 2>&1 &
          echo $! > "$RUNNER_TEMP/ptbo-visual-baseline.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/city-explorer/ >/dev/null && curl --fail --silent http://127.0.0.1:4175/city-explorer/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/visual-refresh/server/current-http.log artifacts/visual-refresh/server/baseline-http.log
          exit 1
      - name: Capture unchanged baseline eye-height and oblique views
        env:
          PTBO_CAPTURE_DRIVER: '0'
          PTBO_QA_REVISION: ${{ env.VISUAL_REFRESH_BASELINE }}
          PTBO_QA_SOURCE_ROOT: ${{ runner.temp }}/ptbo-visual-baseline
        run: node tools/capture-visual-refresh.cjs http://127.0.0.1:4175 baseline ${{ matrix.profile }}
      - name: Capture current eye-height, oblique, and actual cab views
        if: ${{ !cancelled() && steps.visual-servers.outcome == 'success' }}
        env:
          PTBO_CAPTURE_DRIVE_SMOKE: '1'
        run: node tools/capture-visual-refresh.cjs http://127.0.0.1:4174 current ${{ matrix.profile }}
      - name: Capture matched current procedural-wall controls
        if: ${{ !cancelled() && steps.visual-servers.outcome == 'success' }}
        env:
          PTBO_CAPTURE_QUERY: wallMaterials=procedural
          PTBO_CAPTURE_SITES: chemong-r058-1002815291,generic-residential,generic-commercial,station-1,sherbrooke
        run: node tools/capture-visual-refresh.cjs http://127.0.0.1:4174 procedural ${{ matrix.profile }}
      - name: Create the evidence comparison index
        if: always()
        run: node tools/capture-visual-refresh.cjs --compare baseline current procedural
      - name: Stop capture servers
        if: always()
        run: |
          for pidfile in "$RUNNER_TEMP/ptbo-visual-current.pid" "$RUNNER_TEMP/ptbo-visual-baseline.pid"; do
            if test -f "$pidfile"; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
      - name: Preserve actual render evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-refresh-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual-refresh/
          if-no-files-found: error
          retention-days: 14

  vehicle-multiplayer-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install multiplayer and UI regression dependencies
        run: |
          npm ci --prefix tools/location-report-tests --ignore-scripts --no-audit
          npm ci --prefix city-explorer/multiplayer/server --ignore-scripts --no-audit
      - name: Run vehicle handling and multiplayer regression suite
        run: node --test tests/gameplay-reset-spawn.test.mjs tests/vehicle-handling.test.mjs tests/vehicle-fleet.test.mjs tests/multiplayer-*.test.mjs

  driving-upgrade-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [solo, multiplayer]
    env:
      MAP_QA_URL: http://127.0.0.1:4199
      MULTIPLAYER_QA_SERVER: http://127.0.0.1:2569
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and multiplayer runtime
        run: |
          npm ci --prefix city-explorer/multiplayer/server --ignore-scripts --no-audit
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Start matching local simulator and multiplayer server
        id: servers
        env:
          NODE_ENV: development
          HOST: 127.0.0.1
          PORT: 2569
          EXPLORER_WORLD_CONFIG: ./city-explorer/multiplayer/server/src/world-config.mjs
        run: |
          mkdir -p artifacts/driving-upgrade-ci
          python3 -m http.server 4199 --bind 127.0.0.1 > artifacts/driving-upgrade-ci/http.log 2>&1 &
          echo $! > /tmp/ptbo-upgrade-http.pid
          node city-explorer/multiplayer/server/src/index.mjs > artifacts/driving-upgrade-ci/multiplayer.log 2>&1 &
          echo $! > /tmp/ptbo-upgrade-multiplayer.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$MAP_QA_URL/city-explorer/" >/dev/null && curl --fail --silent "$MULTIPLAYER_QA_SERVER/healthz" > artifacts/driving-upgrade-ci/health.json; then
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {PROTOCOL_VERSION} from './city-explorer/multiplayer/protocol.mjs';
          const health=JSON.parse(readFileSync('artifacts/driving-upgrade-ci/health.json','utf8'));
          const world=JSON.parse(readFileSync('city-explorer/multiplayer/world-data/v1/world-manifest.json','utf8'));
          assert.equal(health.status,'ready');
          assert.equal(health.protocolVersion,PROTOCOL_VERSION);
          assert.equal(health.worldVersion,world.worldVersion);
          NODE
              exit 0
            fi
            sleep 1
          done
          cat artifacts/driving-upgrade-ci/http.log artifacts/driving-upgrade-ci/multiplayer.log
          exit 1
      - name: Check desktop and touch driving upgrade
        if: matrix.scenario == 'solo'
        run: node tools/check-driving-upgrade.mjs
      - name: Check two-client multiplayer driving upgrade
        if: ${{ matrix.scenario == 'multiplayer' && !cancelled() && steps.servers.outcome == 'success' }}
        run: node tools/check-multiplayer-driving-upgrade.mjs
      - name: Stop local test servers
        if: always()
        run: |
          for pidfile in /tmp/ptbo-upgrade-http.pid /tmp/ptbo-upgrade-multiplayer.pid; do
            if test -f "$pidfile"; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
      - name: Preserve driving upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-upgrade-smoke-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/driving-upgrade/
            artifacts/multiplayer-driving-upgrade/
            artifacts/driving-upgrade-ci/
          if-no-files-found: warn
          retention-days: 14

  station-1-driving:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run authored scene runtime unit tests
        run: node tools/test_authored_scene_runtime.mjs

      - name: Verify road geometry and driver contact regressions
        run: |
          node --input-type=module --check < city-explorer/app.js
          node --check city-explorer/citywide-road-quality.js
          node --check city-explorer/fallback-junction-geometry.js
          node --check city-explorer/road-wheel-contact.js
          node tools/test_street_marking_evidence.mjs
          node tools/test_street_paint_runtime_edges.mjs
          node tools/test_city_detail_rules.mjs
          node tools/test_citywide_road_quality.mjs
          node tools/test_fallback_junction_geometry.mjs
          node tools/test_station_road_detail.mjs
          node tools/test_gameplay_systems.mjs
          node tools/test_official_road_surface_index.mjs
          node tools/test_rendered_pavement.mjs
          node tools/geospatial/test_road_network.mjs
          node tools/geospatial/test_road_terrain_clearance.mjs

      - name: Install Playwright test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Start local simulator server
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/ptbo-http.log 2>&1 &
          echo $! > /tmp/ptbo-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/city-explorer/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ptbo-http.log
          exit 1

      - name: Check road startup and report browser errors
        run: node tools/check-road-preview-smoke.cjs http://127.0.0.1:4174

      - name: Run authored scene fail-open integration QA
        run: node tools/check-authored-scene.cjs http://127.0.0.1:4174

      - name: Run deterministic Station 1 driving QA
        env:
          PTBO_QA_ARTIFACT_DIR: artifacts/driving-qa
        run: node tools/check-station-driving.cjs http://127.0.0.1:4174 station-1-ci

      - name: Run mobile controls and responsive-layout QA
        env:
          PTBO_QA_ARTIFACT_DIR: artifacts/mobile-qa
        run: node tools/check-mobile-controls.cjs http://127.0.0.1:4174 mobile-ci

      - name: Check simultaneous movement and camera touches
        env:
          PTBO_QA_ARTIFACT_DIR: artifacts/mobile-qa
        run: node tools/check-multitouch-controls.cjs http://127.0.0.1:4174 multitouch-ci

      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-explorer-browser-qa-${{ github.run_id }}
          path: |
            artifacts/driving-qa/
            artifacts/mobile-qa/
            /tmp/ptbo-http.log
          if-no-files-found: warn
          retention-days: 14
