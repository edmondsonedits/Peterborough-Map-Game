name: City Explorer Browser QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/hunter-bridge-editor-test.cjs'
      - '.github/workflows/city-explorer-browser-qa.yml'
permissions:
  contents: read
jobs:
  hunter-bridge-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Test the published Hunter Street bridge editor
        run: node tools/hunter-bridge-editor-test.cjs
      - name: Preserve screenshots and command results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-bridge-editor-test
          path: artifacts/hunter-bridge-editor/
          retention-days: 7
