<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0a08"><title>Tunnel Break</title><style>html,body{margin:0;height:100%;background:#0d0a08;color:#eadbc4;font-family:system-ui;display:grid;place-items:center}.load{text-align:center}.spin{width:34px;height:34px;border:3px solid #59402f;border-top-color:#66ded4;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><b>Opening Tunnel Break v2.1…</b></div><script>(async()=>{try{const fs=['v21-1.b64','v21-2.b64','v21-3.b64','v21-4.b64','v21-5.b64'];const Z=(await Promise.all(fs.map(async f=>{const r=await fetch(f,{cache:'no-cache'});if(!r.ok)throw new Error(f+' '+r.status);return(await r.text()).trim()}))).join('');const bin=atob(Z),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Could not load Tunnel Break.</b><br><small>'+String(e)+'</small></div>'}})();</script></body></html>
