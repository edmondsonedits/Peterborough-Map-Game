<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0a08"><title>Tunnel Break v3.0</title><style>html,body{margin:0;height:100%;background:#0d0a08;color:#eadbc4;font-family:system-ui;display:grid;place-items:center}.load{text-align:center;padding:24px}.spin{width:38px;height:38px;border:3px solid #59402f;border-top-color:#66ded4;border-radius:50%;animation:s .9s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:8px;color:#ad9c89}</style></head><body><div class="load"><div class="spin"></div><b>Opening Tunnel Break v3.0…</b><small>Building your tunnels.</small></div><script>(async()=>{try{const fs=['v30-1.b64','v30-2.b64','v30-3a.b64','v30-3b.b64','v30-4.b64','v30-5.b64','v30-6a.b64','v30-6b1.b64','v30-6b2.b64','v30-6b3.b64','v30-6b4.b64','v30-7.b64'];const Z=(await Promise.all(fs.map(async f=>{const r=await fetch(f,{cache:'no-cache'});if(!r.ok)throw new Error(f+' '+r.status);return(await r.text()).trim()}))).join('');const bytes=Uint8Array.from(atob(Z),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Could not load Tunnel Break v3.0.</b><small>'+String(e)+'</small></div>'}})();</script></body></html>
