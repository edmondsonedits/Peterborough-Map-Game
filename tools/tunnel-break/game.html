function renderMap(ctx,w,state,s,x,y,mw,mh){ctx.save();ctx.fillStyle='rgba(10,8,7,.92)';ctx.strokeStyle='#6e5745';ctx.lineWidth=2;ctx.fillRect(x,y,mw,mh);ctx.strokeRect(x,y,mw,mh);const b=w.boardBounds,pad=8,sc=Math.min((mw-pad*2)/(b.maxX-b.minX||1),(mh-pad*2)/(b.maxY-b.minY||1)),ox=x+mw/2-(b.minX+b.maxX)/2*sc,oy=y+mh/2-(b.minY+b.maxY)/2*sc;for(const p of Object.values(state.pieces||{})){ctx.fillStyle='#34261e';ctx.strokeStyle='#80624d';ctx.lineWidth=1;ctx.fillRect(ox+p.x*sc,oy+p.y*sc,p.width*sc,p.height*sc);ctx.strokeRect(ox+p.x*sc,oy+p.y*sc,p.width*sc,p.height*sc);const cx=ox+(p.x+p.width/2)*sc,cy=oy+(p.y+p.height/2)*sc;ctx.strokeStyle='#c78a58';ctx.lineWidth=Math.max(1,sc*.16);for(const port of p.ports||[]){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ox+(p.x+port.x)*sc,oy+(p.y+port.y)*sc);ctx.stroke();}}for(const b0 of state.breaches||[]){if(b0.sealed)continue;ctx.fillStyle='#ff534b';ctx.beginPath();ctx.arc(ox+b0.px*sc,oy+b0.py*sc,3,0,Math.PI*2);ctx.fill();}const pb=gridToBoard(w,s.player.x,s.player.y);ctx.fillStyle='#71ed8d';ctx.beginPath();ctx.arc(ox+pb.x*sc,oy+pb.y*sc,4,0,Math.PI*2);ctx.fill();const gb=gridToBoard(w,w.goal.x,w.goal.y);ctx.fillStyle='#6de98d';ctx.fillRect(ox+gb.x*sc-3,oy+gb.y*sc-3,6,6);ctx.restore();}

const STORE='tunnel-break-v21-save',SETTINGS='tunnel-break-v21-settings';let state=null,ui={selectedUid:null,rotation:0,side:5,preview:null,legal:[],allLegal:[],mapSelection:[],hintPlacement:null,hintPiece:null},cam={cx:4,cy:2,scale:21},settings={coach:true,hints:true,haptics:true},toastTimer=0,lastStateStatus='',fpWorld=null,fpSession=null,fpRAF=0,fpLast=0,fpHudTick=0,fpSaveTick=0,fpIntro=false;const fpTouch={forward:0,strafe:0,run:false},fpKeys=new Set();try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch(_){ }
function vibrate(ms=18){if(settings.haptics)navigator.vibrate?.(ms)}function toast(t){clearTimeout(toastTimer);el.toast.textContent=t;el.toast.classList.add('show');toastTimer=setTimeout(()=>el.toast.classList.remove('show'),2300)}

function showGame(){el.menu.classList.add('hidden');el.game.classList.remove('hidden');requestAnimationFrame(()=>{resizeCanvas();if(state?.mode===G.MODE.MAZE){initFirstPerson(false);renderAll()}else{fitBoard();renderAll()}})}
function resetUi(){return{selectedUid:null,rotation:0,side:5,preview:null,legal:[],allLegal:[],mapSelection:[],hintPlacement:null,hintPiece:null}}
function restartSiege(){if(!state||state.mode!==G.MODE.MAZE)return;const base=JSON.parse(JSON.stringify(state));base.mode=state.originalMode;base.status=state.originalResult;base.seed=state.originalSeed||String(state.seed||'').replace(/-siege$/,'');base.resultReason='';delete base.fp;state=G.createMazeRun(base);state.decisionReview=base.decisionReview||[];lastStateStatus='playing';ui=resetUi();save();initFirstPerson(true);renderAll();playFPIntro()}
function modeMeta(m){if(m===G.MODE.BANDIDO)return{name:'Bandido',objective:'Seal every escape route.'};if(m===G.MODE.CATCH)return{name:'Catch Bandida',objective:'Seal every escape route.'};if(m===G.MODE.ESCAPE)return{name:'Help Bandida Escape',objective:'Connect the ladder, then seal every other route.'};if(m===G.MODE.LOVERS)return{name:"The Lovers’ Escape",objective:'Connect Bandido + Bandida to the ladder, then seal all other routes.'};if(m===G.MODE.MAZE)return{name:'Escape Your Maze',objective:'Reach the green exit. Seal red breaches if they block your route.'};return{name:'Tunnel Break',objective:''}}

function startSetup(kind){const isB=kind==='bandido';openModal(`<h2>${isB?'Bandido':'Bandida'} Setup</h2>${!isB?`<h3>Objective</h3><div class="choice-grid"><label class="choice"><input type="radio" name="mode" value="${G.MODE.CATCH}" checked><b>Catch Bandida</b><small>Seal every route</small></label><label class="choice"><input type="radio" name="mode" value="${G.MODE.ESCAPE}"><b>Help Escape</b><small>Lead her to the ladder</small></label><label class="choice"><input type="radio" name="mode" value="${G.MODE.LOVERS}"><b>Lovers</b><small>Connect both prisoners + ladder</small></label></div>`:''}<h3>Starting side</h3><div class="choice-grid"><label class="choice"><input type="radio" name="diff" value="5" checked><b>5 exits</b><small>Official easier side</small></label><label class="choice"><input type="radio" name="diff" value="6"><b>6 exits</b><small>Official harder side</small></label></div><h3>Ruleset</h3><div class="choice-grid"><label class="choice"><input type="radio" name="variant" value="classic" checked><b>Classic</b><small>Official card rules. No assistance to the deck.</small></label><label class="choice"><input type="radio" name="variant" value="balanced"><b>Balanced</b><small>Classic + 2 visible Planning Tokens.</small></label></div><div class="modal-actions"><button class="btn btn-primary" data-start>Start Game</button><button class="btn" data-close>Cancel</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('[data-start]').onclick=()=>{const mode=isB?G.MODE.BANDIDO:m.querySelector('input[name=mode]:checked').value,d=+m.querySelector('input[name=diff]:checked').value,v=m.querySelector('input[name=variant]:checked').value;closeModal();start(mode,d,v)}})}
function daily(){const d=new Date(),key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');start(G.MODE.BANDIDO,6,G.VARIANT.CLASSIC,`daily-${key}`);toast(`Daily Challenge • ${key}`)}
function rules(){openModal(`<h2>How to Play</h2><h3>Game 1 • Build the board</h3><p>Play one rectangular tunnel card so every touching tunnel mouth matches another tunnel mouth. A tunnel may never run into solid ground. Rotate cards freely before placement.</p><p>If none of the cards in your current hand can be placed, put the <b>entire hand</b> at the bottom of the draw pile and take the same number again.</p><h3>Game 2 • Escape Your Maze</h3><p>Your exact finished board becomes a first-person maze. The rules are deliberately tiny:</p><ul><li><b>Escape:</b> reach the glowing green exit.</li><li><b>Move:</b> WASD or the mobile thumb stick.</li><li><b>Look:</b> drag the view or use the arrow keys.</li><li><b>Red breaches:</b> every open tunnel mouth from Game 1 becomes an enemy entrance. Move close and tap <b>SEAL</b> to close one.</li><li><b>Hunters:</b> they always find the shortest connected route toward you, but <b>they move only while you move</b>. Stop whenever you need time to think.</li><li><b>Three hearts:</b> getting caught costs one heart. Lose all three and restart the exact same maze.</li><li><b>Map:</b> open the original card board whenever you need to plan.</li></ul><h3>How you get better</h3><p>Replay the same maze, learn the shortest route, use loops instead of dead ends, seal the most dangerous breaches, and build a cleaner board in Game 1 so the next maze starts with less pressure.</p><h3>Balanced variant</h3><p>Balanced gives two visible Planning Tokens in Game 1. Classic never manipulates your deck secretly.</p><div class="modal-actions"><button class="btn btn-primary" data-close>Got it</button></div>`,m=>m.querySelector('[data-close]').onclick=closeModal)}
function settingsModal(){openModal(`<h2>Settings</h2><label class="switch"><span><b>Decision Coach</b><div class="tiny">Grades moves for the post-game review.</div></span><input type="checkbox" data-coach ${settings.coach?'checked':''}></label><label class="switch"><span><b>Hints</b><div class="tiny">Allow strategy hints during play.</div></span><input type="checkbox" data-hints ${settings.hints?'checked':''}></label><label class="switch"><span><b>Haptics</b><div class="tiny">Small vibration on placement.</div></span><input type="checkbox" data-haptics ${settings.haptics?'checked':''}></label><div class="modal-actions"><button class="btn btn-primary" data-save>Save</button><button class="btn" data-close>Cancel</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('[data-save]').onclick=()=>{settings.coach=m.querySelector('[data-coach]').checked;settings.hints=m.querySelector('[data-hints]').checked;settings.haptics=m.querySelector('[data-haptics]').checked;let persisted=true;try{localStorage.setItem(SETTINGS,JSON.stringify(settings));}catch(_){persisted=false;}closeModal();toast(persisted?'Settings saved.':'Settings applied for this session; browser storage is unavailable.')}})}
function openModal(html,wire){resetFPInput();el.modal.innerHTML=html;el.modalLayer.classList.remove('hidden');wire?.(el.modal);if(!el.modalLayer.open)el.modalLayer.showModal();}function closeModal(){el.modalLayer.classList.add('hidden');if(el.modalLayer.open)el.modalLayer.close();el.modal.innerHTML=''}

function currentCard(){if(!state||state.mode===G.MODE.MAZE)return null;if(state.forcedCard)return state.forcedCard;return G.cardByUid(state,ui.selectedUid)}
function autoSelect(){if(!state||state.mode===G.MODE.MAZE)return;if(state.forcedCard){ui.selectedUid=state.forcedCard.uid;ui.rotation=0;ui.side=state.forcedCard.superExitCount||5}refreshLegal()}
function refreshLegal(){const c=currentCard();ui.preview=null;ui.hintPlacement=null;if(!c){ui.legal=[];ui.allLegal=[];return}ui.allLegal=G.allLegalPlacements(state,c,c.kind==='bandidoSuper'?ui.side:undefined);ui.legal=ui.allLegal.filter(p=>p.rotation===ui.rotation&&(c.kind!=='bandidoSuper'||p.superExitCount===ui.side))}
function selectCard(uid){if(state.pendingDiscard){const i=state.hand.findIndex(c=>c.uid===uid),r=G.discardForAlarm(state,i);if(!r.ok)toast(r.reason);else{vibrate();afterChange()}return}if(state.pendingMap)return;if(ui.selectedUid===uid){ui.rotation=(ui.rotation+1)%4;refreshLegal();renderAll();return}ui.selectedUid=uid;const c=G.cardByUid(state,uid);ui.rotation=0;ui.side=c?.superExitCount||5;refreshLegal();renderAll()}

function useHint(){if(state.mode===G.MODE.MAZE){ui.hintPiece=G.mazeHint(state);toast(ui.hintPiece?'Next shortest-path card highlighted.':'No hint available.');return}if(!settings.hints){toast('Hints are disabled in Settings.');return}const h=S.hint(G,state,{maxPerCard:38});if(!h.ok){toast(h.text);return}ui.selectedUid=h.best.cardUid;ui.rotation=h.best.rotation;ui.side=h.best.superExitCount||5;refreshLegal();ui.hintPlacement={...h.best};toast(`${h.best.cardLabel}: ${h.best.reasons[0]}.`);renderAll()}
function plan(){const c=currentCard();if(!c||state.forcedCard)return;const i=state.hand.findIndex(x=>x.uid===c.uid),r=G.usePlanningToken(state,i);if(!r.ok){toast(r.reason);return}ui.selectedUid=null;vibrate();afterChange()}
function exchange(){const r=G.exchangeHand(state);if(!r.ok)toast(r.reason);else{ui.selectedUid=null;vibrate(26);afterChange()}}
function confirm(){if(state.mode===G.MODE.MAZE)return;if(state.pendingMap){if(ui.mapSelection.length!==3){toast('Select exactly 3 earlier cards.');return}const r=G.applyMapRemoval(state,ui.mapSelection);if(!r.ok){toast(r.reason);return}ui.mapSelection=[];afterChange();return}if(state.forcedCard&&ui.allLegal.length===0){const r=G.resolveUnplaceableAlarm(state);if(r.ok)afterChange();else toast(r.reason);return}if(!ui.preview){toast('Tap a glowing placement first.');return}const c=currentCard(),move={cardUid:c.uid,handIndex:state.hand.findIndex(x=>x.uid===c.uid),...ui.preview},pre=settings.coach&&!state.forcedCard?G.deserialize(G.serialize(state)):null;const idx=state.forcedCard?-1:move.handIndex,r=G.playCard(state,{handIndex:idx,x:move.x,y:move.y,rotation:move.rotation,superExitCount:move.superExitCount});if(!r.ok){toast(r.reason);return}vibrate();ui.preview=null;ui.selectedUid=null;if(pre)setTimeout(()=>{try{const cmp=S.compareMoveToBest(G,pre,move,{maxPerCard:32});if(cmp.ok){state.decisionReview=state.decisionReview||[];state.decisionReview.push({turn:pre.turn,card:c.label,grade:cmp.grade,gap:Math.round(cmp.scoreGap),best:cmp.best?.cardLabel||''});save()}}catch(_){}},0);afterChange()}
function afterChange(){if(!state)return;let guard=0;while(state.status==='playing'&&state.forcedCard&&G.allLegalPlacements(state,state.forcedCard).length===0&&guard++<3){G.resolveUnplaceableAlarm(state)}autoSelect();save();renderAll();if(state.status!=='playing'&&lastStateStatus==='playing'){lastStateStatus=state.status;setTimeout(showResult,150)}}

function drawPiece(p){const x=sx(p.x),y=sy(p.y),w=p.width*cam.scale,h=p.height*cam.scale;ctx.save();ctx.fillStyle=p.locked?'#8e5534':'#875032';ctx.strokeStyle=p.locked?'#e4b36e':'#a9714d';ctx.lineWidth=2;roundRect(ctx,x,y,w,h,Math.min(10,cam.scale*.35),true,true);const g=G.pieceGeometry(p),cx=x+w/2,cy=y+h/2;ctx.strokeStyle='#3a2016';ctx.lineWidth=Math.max(5,cam.scale*.34);ctx.lineCap='round';ctx.lineJoin='round';for(const q of g.ports){ctx.beginPath();ctx.moveTo(sx(q.px),sy(q.py));ctx.lineTo(cx,cy);ctx.stroke()}ctx.strokeStyle='#d5a66e55';ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,w-4,h-4);if(p.kind==='bandidoStart'||p.kind==='bandidaStart'){ctx.fillStyle='#d9c3a3';ctx.font=`900 ${Math.max(9,cam.scale*.48)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.kind==='bandidoStart'?'BANDIDO':'BANDIDA',cx,cy)}else if(p.card?.badge){ctx.font=`${Math.max(10,cam.scale*.65)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.card.badge,cx,cy)}ctx.restore()}
function drawMazeOverlay(){const neigh=new Set(G.mazeNeighbors(state));for(const id of neigh){const p=state.pieces[id];ctx.strokeStyle=id===ui.hintPiece?'#ffe46b':'#66e6dc';ctx.lineWidth=id===ui.hintPiece?5:3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;roundRect(ctx,sx(p.x)+2,sy(p.y)+2,p.width*cam.scale-4,p.height*cam.scale-4,8,false,true);ctx.shadowBlur=0}for(const b of state.breaches||[]){ctx.beginPath();ctx.fillStyle=b.sealed?'#6b625a':'#ff574f';ctx.shadowColor=b.sealed?'transparent':'#ff332d';ctx.shadowBlur=b.sealed?0:14;ctx.arc(sx(b.px),sy(b.py),Math.max(4,cam.scale*.16),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(b.sealed){ctx.strokeStyle='#c9b8a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(b.px)-5,sy(b.py)-5);ctx.lineTo(sx(b.px)+5,sy(b.py)+5);ctx.moveTo(sx(b.px)+5,sy(b.py)-5);ctx.lineTo(sx(b.px)-5,sy(b.py)+5);ctx.stroke()}}const goal=state.pieces[state.goalPieceId];if(goal){const unlocked=state.collectedGear.length>=state.gearTarget,gx=sx(goal.x),gy=sy(goal.y),gw=goal.width*cam.scale,gh=goal.height*cam.scale;ctx.save();ctx.strokeStyle=unlocked?'#7cf08d':'#f4c35d';ctx.lineWidth=3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=9;if(!unlocked)ctx.setLineDash([5,4]);roundRect(ctx,gx+3,gy+3,gw-6,gh-6,8,false,true);ctx.setLineDash([]);ctx.shadowBlur=0;ctx.font=`${Math.max(18,cam.scale*.85)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(unlocked?(state.originalMode===G.MODE.ESCAPE||state.originalMode===G.MODE.LOVERS?'🪜':'🚪'):'🔒',sx(goal.x+goal.width/2),sy(goal.y+goal.height/2));ctx.restore()}for(const id of state.gearPieceIds||[]){if(state.collectedGear.includes(id))continue;const p=state.pieces[id];if(!p)continue;const gx=sx(p.x+p.width/2),gy=sy(p.y+p.height/2);ctx.save();ctx.beginPath();ctx.fillStyle='#f4c35d';ctx.shadowColor='#ffc94f';ctx.shadowBlur=10;ctx.arc(gx,gy,Math.max(8,cam.scale*.34),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font=`${Math.max(12,cam.scale*.48)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔧',gx,gy);ctx.restore()}for(const id of state.safeRoomIds||[]){if(state.usedSafeRooms.includes(id))continue;const p=state.pieces[id];if(!p)continue;ctx.strokeStyle='#76a9ff';ctx.lineWidth=2;ctx.setLineDash([4,4]);roundRect(ctx,sx(p.x)+4,sy(p.y)+4,p.width*cam.scale-8,p.height*cam.scale-8,7,false,true);ctx.setLineDash([])}const groups={};for(const e of state.enemies||[])(groups[e.pieceId]||(groups[e.pieceId]=[])).push(e);for(const [id,enemies] of Object.entries(groups)){const p=state.pieces[id];if(!p)continue;enemies.forEach((e,i)=>{const a=(i/enemies.length)*Math.PI*2,r=Math.min(cam.scale*.22,8),cx=sx(p.x+p.width/2)+Math.cos(a)*r,cy=sy(p.y+p.height/2)+Math.sin(a)*r;ctx.beginPath();ctx.fillStyle='#ff5d55';ctx.strokeStyle='#4b0d0a';ctx.lineWidth=2;ctx.arc(cx,cy,Math.max(6,cam.scale*.24),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(7,cam.scale*.26)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',cx,cy)})}const player=state.pieces[state.playerPieceId];if(player){ctx.beginPath();ctx.fillStyle='#7cf08d';ctx.strokeStyle='#143e1d';ctx.lineWidth=3;ctx.arc(sx(player.x+player.width/2),sy(player.y+player.height/2),Math.max(7,cam.scale*.3),0,Math.PI*2);ctx.fill();ctx.stroke()}}
function roundRect(c,x,y,w,h,r,fill,stroke){if(w<=0||h<=0)return;r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);if(fill)c.fill();if(stroke)c.stroke()}
function pieceAt(w){const ps=Object.values(state.pieces).sort((a,b)=>(b.placedAtMove||0)-(a.placedAtMove||0));return ps.find(p=>w.x>=p.x&&w.x<=p.x+p.width&&w.y>=p.y&&w.y<=p.y+p.height)}function placementAt(w){const c=currentCard();if(!c)return null;let hits=[];for(const p of ui.legal){const g=G.getCardGeometry(c,p.rotation,p.superExitCount);if(w.x>=p.x&&w.x<=p.x+g.width&&w.y>=p.y&&w.y<=p.y+g.height)hits.push(p)}if(!hits.length)return null;hits.sort((a,b)=>Math.hypot(w.x-(a.x+G.getCardGeometry(c,a.rotation,a.superExitCount).width/2),w.y-(a.y+G.getCardGeometry(c,a.rotation,a.superExitCount).height/2))-Math.hypot(w.x-(b.x+G.getCardGeometry(c,b.rotation,b.superExitCount).width/2),w.y-(b.y+G.getCardGeometry(c,b.rotation,b.superExitCount).height/2)));return hits[0]}
const pointers=new Map();let gest={drag:false,lastDist:0,lastMid:null,suppress:false};el.board.addEventListener('pointerdown',e=>{if(state?.mode===G.MODE.MAZE)return;el.board.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY});gest.drag=false;if(pointers.size===2){const a=[...pointers.values()];gest.lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);gest.lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};gest.suppress=true}});el.board.addEventListener('pointermove',e=>{if(state?.mode===G.MODE.MAZE)return;const p=pointers.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1){const dx=p.x-p.lx,dy=p.y-p.ly;if(Math.hypot(p.x-p.sx,p.y-p.sy)>5)gest.drag=true;if(gest.drag){cam.cx-=dx/cam.scale;cam.cy-=dy/cam.scale;drawBoard()}p.lx=p.x;p.ly=p.y}else{const a=[...pointers.values()].slice(0,2),dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};if(gest.lastDist){cam.scale=Math.max(6,Math.min(58,cam.scale*(dist/gest.lastDist)));cam.cx-=(mid.x-gest.lastMid.x)/cam.scale;cam.cy-=(mid.y-gest.lastMid.y)/cam.scale;drawBoard()}gest.lastDist=dist;gest.lastMid=mid}});function endPointer(e){const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!p)return;if(pointers.size<2&&gest.suppress){setTimeout(()=>gest.suppress=false,60);return}if(!gest.drag&&!gest.suppress){const r=el.board.getBoundingClientRect(),w=world(e.clientX-r.left,e.clientY-r.top);handleBoardTap(w)}}el.board.addEventListener('pointerup',endPointer);function cancelBoardPointer(e){pointers.delete(e.pointerId);if(!pointers.size){gest.drag=false;gest.suppress=false;}}el.board.addEventListener('pointercancel',cancelBoardPointer);el.board.addEventListener('lostpointercapture',cancelBoardPointer);
function handleBoardTap(w){if(state.mode===G.MODE.MAZE||!el.modalLayer.classList.contains('hidden'))return;if(state.pendingMap){const p=pieceAt(w);if(!p||p.locked||p.id===state.pendingMapPieceId)return;const i=ui.mapSelection.indexOf(p.id);if(i>=0)ui.mapSelection.splice(i,1);else if(ui.mapSelection.length<3)ui.mapSelection.push(p.id);renderAll();return}const p=placementAt(w);if(p){ui.preview={...p};vibrate(8);renderAll()}}
el.seal.onclick=()=>{if(state?.mode!==G.MODE.MAZE||!fpSession)return;const r=FP.sealNearest(state,fpWorld,fpSession);if(!r.ok){toast(r.reason);return}vibrate(28);state.fp=FP.saveSession(fpSession);save();renderFPHud()};el.siegeHint.onclick=()=>{if(state?.mode!==G.MODE.MAZE||!fpSession)return;fpSession.mapOpen=!fpSession.mapOpen;renderFPHud();renderFPFrame(performance.now())};el.zoomIn.onclick=()=>{cam.scale=Math.min(58,cam.scale*1.2);drawBoard()};el.zoomOut.onclick=()=>{cam.scale=Math.max(6,cam.scale/1.2);drawBoard()};el.fit.onclick=fitBoard;el.rotate.onclick=rotate;el.side.onclick=toggleSide;el.hint.onclick=useHint;el.plan.onclick=plan;el.place.onclick=confirm;el.exchange.onclick=exchange;el.pause.onclick=pause;el.back.onclick=pause;el.bandido.onclick=()=>startSetup('bandido');el.bandida.onclick=()=>startSetup('bandida');el.daily.onclick=daily;el.rules.onclick=rules;el.settings.onclick=settingsModal;el.cont.onclick=()=>{const s=saved();if(!s){toast('No compatible save found.');return}state=s;state.decisionReview=state.decisionReview||[];lastStateStatus=state.status;ui=resetUi();showGame();autoSelect();if(state.status!=='playing')setTimeout(showResult,120)};
let titleTaps=[];el.brand.onclick=()=>{const now=Date.now();titleTaps=titleTaps.filter(t=>now-t<3000);titleTaps.push(now);if(titleTaps.length>=10){window.__TB_DEV=true;toast('Developer diagnostics enabled.');titleTaps=[]}};
window.TunnelBreakDebug={getState:()=>state,start:(mode='bandido',difficulty=5,variant='classic',seed='debug')=>start(mode,difficulty,variant,seed),autoStep:()=>{if(!state||state.status!=='playing'||state.mode===G.MODE.MAZE)return state?G.stateSummary(state):null;if(state.pendingMap){const c=G.findValidMapRemoval(state);if(c)G.applyMapRemoval(state,c);afterChange();return G.stateSummary(state)}if(state.pendingDiscard){G.discardForAlarm(state,0);afterChange();return G.stateSummary(state)}if(state.forcedCard){const ps=G.allLegalPlacements(state,state.forcedCard);if(ps.length)G.playCard(state,{handIndex:-1,...ps[0]});else G.resolveUnplaceableAlarm(state);afterChange();return G.stateSummary(state)}if(G.canExchangeHand(state)){G.exchangeHand(state);afterChange();return G.stateSummary(state)}for(let i=0;i<state.hand.length;i++){const ps=G.allLegalPlacements(state,state.hand[i]);if(ps.length){G.playCard(state,{handIndex:i,...ps[0]});afterChange();return G.stateSummary(state)}}G.evaluateGame(state);afterChange();return G.stateSummary(state)},forceWin:()=>{if(state){G.debugSetResult(state,'won');afterChange()}},startMaze:()=>{if(state&&state.mode!==G.MODE.MAZE&&state.status!=='playing'){state=G.createMazeRun(state);lastStateStatus='playing';ui=resetUi();initFirstPerson(true);renderAll()}},fpSummary:()=>state?.mode===G.MODE.MAZE&&fpSession?FP.summary(state,fpSession):null,fpWorld:()=>fpWorld?{width:fpWorld.width,height:fpWorld.height,gear:fpWorld.gear.length,breaches:fpWorld.breaches.length,start:fpWorld.start,goal:fpWorld.goal}:null,fpTeleport:(x,y)=>{if(fpSession){fpSession.player.x=x;fpSession.player.y=y}},fpGoal:()=>{if(fpSession&&fpWorld){fpSession.player.x=fpWorld.goal.x;fpSession.player.y=fpWorld.goal.y;state.collectedGear=[...state.gearPieceIds];FP.update(G,state,fpWorld,fpSession,{forward:0,strafe:0,turn:0,run:false},.016);renderAll()}},fpDamage:()=>{if(fpSession){fpSession.health=1;fpSession.enemies.push({id:'debug-hit',x:fpSession.player.x+.1,y:fpSession.player.y,s
