<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Choose a Fire or EMS station and practise its local response calls.">
  <title>Choose a station · Route Mapping</title>
  <link rel="stylesheet" href="./styles.css?v=1.6.124">
</head>
<body class="station-picker-page">
  <main id="station-picker" class="station-picker" aria-busy="true">
    <div class="picker-content">
      <a id="picker-back" class="picker-back" href="../"><span aria-hidden="true">←</span> All games</a>
      <header class="picker-heading">
        <p class="picker-eyebrow">ROUTE MAPPING <span aria-hidden="true">/</span> <span id="picker-city">Your city</span></p>
        <h1>Choose a station</h1>
        <p>Pick your starting point. Practise calls in its local area.</p>
      </header>
      <div class="picker-toolbar">
        <div class="picker-services" role="group" aria-label="Service">
          <button id="picker-fire" type="button" aria-pressed="true" disabled>Fire</button>
          <button id="picker-ems" type="button" aria-pressed="false" disabled>EMS</button>
        </div>
        <label class="station-search-label"><span class="sr-only">Find a station</span><input id="station-search" type="search" placeholder="Station name, number or street" autocomplete="off" disabled></label>
      </div>
      <p id="station-status" class="station-status" role="status" aria-live="polite">Loading stations…</p>
      <ul id="station-list" class="station-list" aria-label="Stations"></ul>
      <button id="station-retry" class="secondary" type="button" hidden>Retry</button>
    </div>
  </main>
  <script src="../shared/build-version.js?v=1.6.124"></script>
  <script src="../cities/city-registry.js?v=1.6.124"></script>
  <script src="../shared/location-changes.js?v=1.6.124"></script>
  <script src="../shared/city-location-runtime.js?v=1.6.124"></script>
  <script src="./station-core.js?v=1.6.124"></script>
  <script src="./stations.js?v=1.6.124"></script>
</body>
</html>
