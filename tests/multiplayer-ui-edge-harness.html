<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room UI isolated browser harness</title>
<style>
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#07131b; color:#edf3ee; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  #scene { position:fixed; inset:0; overflow:hidden; background:radial-gradient(ellipse at 72% 44%,rgba(59,91,79,.35),transparent 38%),linear-gradient(160deg,#122d31 0%,#0b2027 42%,#07131b 100%); }
  #scene::before { content:""; position:absolute; inset:-30%; opacity:.28; transform:perspective(500px) rotateX(57deg) rotateZ(-12deg); background-image:linear-gradient(rgba(200,172,102,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(200,172,102,.32) 1px,transparent 1px); background-size:80px 80px; }
  #scene::after { content:""; position:absolute; left:48%; top:43%; width:22px; height:22px; border:1px solid rgba(237,212,141,.75); transform:translate(-50%,-50%) rotate(45deg); box-shadow:0 0 24px rgba(237,212,141,.42); }
  #fixture-state { position:fixed; right:12px; bottom:12px; z-index:1; padding:5px 8px; color:#aab6af; background:rgba(5,17,24,.7); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="fixture-state">Isolated UI review</div>
<script type="module">
  import { createRoomUi } from '../city-explorer/multiplayer/room-ui.mjs';
  const pending = { create: [], join: [] };
  const callbacks = {
    createRoom: () => new Promise((resolve) => pending.create.push(resolve)),
    joinRoom: () => new Promise((resolve) => pending.join.push(resolve)),
    listRooms: () => Promise.resolve({ rooms: [] }),
    leaveRoom: () => Promise.resolve(),
    admin: () => Promise.resolve(),
    selectVehicle: () => Promise.resolve(),
  };
  const ui = createRoomUi({ parent: document.body, callbacks });
  window.__roomUi = ui;
  window.__pending = pending;
  window.__finish = (type, index, result) => pending[type][index]?.(result);
  const session = {
    roomCode:'FIRE-4821', roomId:'browser-room', playerId:'player-1', seat:1, epoch:1,
    isAdmin:true, vehicleId:'engine-1', ping:22, connectionStatus:'Connected',
  };
  const mode = new URL(location.href).searchParams.get('view') || 'lobby';
  if (mode === 'session') {
    ui.update({ session, locked:false, connectionStatus:'Connected', selectedVehicleId:'engine-1',
      players:[{playerId:'player-1',seat:1,isAdmin:true},{playerId:'player-2',seat:2}],
      vehicles:[{id:'engine-1',label:'Engine 1'},{id:'rescue-1',label:'Rescue 1'}] });
  } else {
    ui.update({ rooms:[{id:'room-a',name:'Downtown response',count:2,capacity:8},{id:'room-b',name:'Station 2 drive',count:1,capacity:8}] });
  }
  ui.open();
</script>
</body>
</html>
